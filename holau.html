<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lau Family Reunion Trip Planner · 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f3ec;
    --warm-white: #faf8f4;
    --sand: #e8dfc9;
    --terracotta: #c4714a;
    --deep-green: #2d4a3e;
    --forest: #3d6357;
    --gold: #b8924a;
    --charcoal: #2a2520;
    --muted: #7a6e62;
    --light-border: #ddd5c4;
    --yes: #2d6a4f;
    --no: #c4714a;
    --partial: #b8924a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    font-weight: 300;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  /* ── HERO ── */
  .hero {
    background: var(--deep-green);
    padding: 80px 40px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(184,146,74,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 20%, rgba(61,99,87,0.4) 0%, transparent 50%);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
  .hero-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    font-weight: 300;
    color: var(--warm-white);
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--sand);
  }
  .hero-sub {
    color: rgba(247,243,236,0.65);
    font-size: 0.95rem;
    font-weight: 300;
    margin-top: 12px;
    letter-spacing: 0.02em;
  }

  /* ── CAST ── */
  .cast-section {
    background: var(--charcoal);
    padding: 48px 40px;
  }
  .cast-inner { max-width: 1100px; margin: 0 auto; }
  .cast-heading {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
  }
  .cast-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px;
  }
  .cast-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 18px;
  }
  .cast-card .family-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--sand);
    margin-bottom: 6px;
  }
  .cast-card .members {
    font-size: 0.78rem;
    color: rgba(247,243,236,0.55);
    line-height: 1.7;
  }
  .cast-card .tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 8px;
    background: rgba(184,146,74,0.2);
    color: var(--gold);
  }

  /* ── WINDOW BANNER ── */
  .window-banner {
    background: var(--terracotta);
    padding: 14px 40px;
    text-align: center;
  }
  .window-banner p {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: white;
    text-transform: uppercase;
  }
  .window-banner strong { color: rgba(255,255,255,0.9); }

  /* ── NAV ── */
  .sticky-nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--warm-white);
    border-bottom: 1px solid var(--light-border);
    padding: 0 40px;
    overflow-x: auto;
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; gap: 0;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    padding: 14px 16px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav-link:hover { color: var(--deep-green); border-color: var(--deep-green); }

  /* ── MAIN ── */
  .main { max-width: 1200px; margin: 0 auto; padding: 60px 40px; }

  /* ── SECTION HEADERS ── */
  .section-header {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 36px; padding-bottom: 16px;
    border-bottom: 1px solid var(--light-border);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300;
    color: var(--deep-green);
  }
  .section-note {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ── RESORT CARD ── */
  .resort { margin-bottom: 72px; scroll-margin-top: 60px; }
  .resort-header {
    display: grid; grid-template-columns: 1fr auto;
    align-items: start; gap: 16px; margin-bottom: 24px;
  }
  .resort-title-group {}
  .resort-emoji { font-size: 1.5rem; margin-right: 10px; }
  .resort-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem; font-weight: 400;
    color: var(--charcoal); line-height: 1.1;
  }
  .resort-location {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
    margin-top: 4px;
  }
  .resort-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .badge {
    font-size: 0.65rem; font-family: 'DM Mono', monospace;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: 0.1em; text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-ai { background: #d4edda; color: #155724; }
  .badge-partial { background: #fff3cd; color: #856404; }
  .badge-noai { background: #f8d7da; color: #721c24; }
  .badge-points { background: #cce5ff; color: #004085; }
  .badge-warning { background: #fff3cd; color: #856404; }

  /* ── QUICK STATS ROW ── */
  .quick-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--light-border);
    border: 1px solid var(--light-border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .stat-cell {
    background: var(--warm-white);
    padding: 16px;
    text-align: center;
  }
  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 0.9rem; font-weight: 500;
    color: var(--charcoal); line-height: 1.3;
  }
  .stat-value.price { color: var(--deep-green); font-weight: 600; }
  .stat-value.small { font-size: 0.78rem; }

  /* ── MAIN CONTENT GRID ── */
  .resort-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 700px) { .resort-grid { grid-template-columns: 1fr; } }

  .info-block {
    background: var(--warm-white);
    border: 1px solid var(--light-border);
    border-radius: 10px;
    padding: 22px;
  }
  .info-block.full { grid-column: 1 / -1; }

  /* Ensure touch targets are large enough */
  @media (hover: none) {
    .nav-link { padding-top: 14px; padding-bottom: 14px; }
    .highlight-tag { padding: 7px 12px; }
  }
  .info-block h4 {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--light-border);
  }
  .info-block p { font-size: 0.88rem; color: var(--charcoal); line-height: 1.65; }
  .info-block p + p { margin-top: 8px; }

  .flight-table { width:
